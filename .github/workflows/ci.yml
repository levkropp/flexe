name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 500M

jobs:
  # Two compilers, because the tree is built with -Werror and they disagree
  # about which warnings exist.
  unit:
    name: unit tests (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache libssl-dev ${{ matrix.cc }}
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-v1-unit-${{ runner.os }}-${{ matrix.cc }}-${{ hashFiles('.github/workflows/ci.yml', 'CMakeLists.txt', 'src/**', 'tests/**') }}
          restore-keys: |
            ccache-v1-unit-${{ runner.os }}-${{ matrix.cc }}-
      - name: Configure
        # -DNATIVE_ARCH=OFF: a shared runner's CPU should not be baked into
        # the build, and -march=native there produced a feature combination
        # clang rejects under -Werror.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DNATIVE_ARCH=OFF
      - name: Build
        run: cmake --build build --target xtensa-tests -j"$(nproc)"
      - name: Unit tests
        run: ./build/xtensa-tests --quiet

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache libssl-dev
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-v1-asan-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'CMakeLists.txt', 'src/**', 'tests/**') }}
          restore-keys: |
            ccache-v1-asan-${{ runner.os }}-
      - name: Configure
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DNATIVE_ARCH=OFF \
            -DFLEXE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-asan --target xtensa-tests -j"$(nproc)"
      - name: Unit tests
        env:
          # Leak detection is on: the suite is leak-clean, and a test that
          # forgets to tear down its emulator leaks a whole address space.
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build-asan/xtensa-tests --quiet

  # The JIT has two backends and only one of them is exercised by a host
  # build. A native aarch64 runner would be better, but a cross-compile at
  # least catches the common failure: adding an emitter helper on one side
  # and calling it from shared code. openssl-dependent sources are skipped
  # because the cross toolchain has no aarch64 openssl headers; none of them
  # contain backend-specific code.
  cross-aarch64:
    name: aarch64 cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gcc-aarch64-linux-gnu
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-v1-aarch64-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'src/**') }}
          restore-keys: |
            ccache-v1-aarch64-${{ runner.os }}-
      - name: Compile every backend-relevant source
        run: |
          sources=()
          for f in src/*.c; do
            case "$(basename "$f")" in
              loader.c|mpi_stubs.c|sha_stubs.c|wifi_stubs.c) continue ;;
            esac
            sources+=("$f")
          done
          build_dir="$RUNNER_TEMP/flexe-aarch64"
          mkdir -p "$build_dir"
          # Compile independent translation units concurrently. gnu17, not
          # c11: c11 hides pread/pwrite behind feature macros.
          printf '%s\0' "${sources[@]}" | \
            xargs -0 -n1 -P"$(nproc)" bash -c '
              build_dir=$1
              source=$2
              object="$build_dir/$(basename "${source%.c}").o"
              exec ccache aarch64-linux-gnu-gcc \
                -std=gnu17 -O2 -Wall -Wextra -Wno-unused-parameter \
                -c -I src "$source" -o "$object"
            ' _ "$build_dir"

  # Compiled-firmware coverage. Slower than the rest, and the only job that
  # needs a toolchain download, so it is kept separate: a failure here means
  # peripheral behaviour changed, not that the build is broken.
  hardware-gates:
    name: arduino hardware gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache libssl-dev
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-v1-gates-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'CMakeLists.txt', 'src/**', 'tools/**') }}
          restore-keys: |
            ccache-v1-gates-${{ runner.os }}-
      - name: Restore pinned Arduino toolchain
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-cli-1.5.1-esp32-2.0.11-${{ runner.os }}
      - name: Install arduino-cli and ESP32 core 2.0.11
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 3 --retry-delay 2 \
            https://downloads.arduino.cc/arduino-cli/arduino-cli_1.5.1_Linux_64bit.tar.gz \
            -o "$RUNNER_TEMP/arduino-cli.tar.gz"
          printf '%s  %s\n' \
            28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b \
            "$RUNNER_TEMP/arduino-cli.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/arduino-cli.tar.gz" -C "$HOME/bin" arduino-cli
          "$HOME/bin/arduino-cli" version
          if "$HOME/bin/arduino-cli" core list 2>/dev/null | \
              grep -Eq '^esp32:esp32[[:space:]]+2\.0\.11'; then
            echo "Reusing cached ESP32 core 2.0.11"
          else
            "$HOME/bin/arduino-cli" core update-index \
              --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
            for attempt in 1 2 3 4; do
              if "$HOME/bin/arduino-cli" core install esp32:esp32@2.0.11 \
                  --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json; then
                break
              fi
              if [[ "$attempt" -eq 4 ]]; then
                echo "ESP32 core installation failed after four attempts" >&2
                exit 1
              fi
              sleep "$((attempt * 10))"
            done
          fi
      - name: Restore compiled fixture firmware
        uses: actions/cache@v4
        with:
          path: |
            build/arduino-fixtures/*/*.ino.bin
            build/arduino-fixtures/*/*.ino.elf
            build/arduino-fixtures/*/.flexe-fixture.sha256
          key: arduino-fixtures-v2-esp32-2.0.11-${{ runner.os }}-${{ hashFiles('tests/fixtures/**/*.ino', 'scripts/test-fixtures.sh') }}
          restore-keys: |
            arduino-fixtures-v2-esp32-2.0.11-${{ runner.os }}-
            arduino-fixtures-v1-esp32-2.0.11-${{ runner.os }}-
      - name: Restore compiled Arduino core
        uses: actions/cache@v4
        with:
          path: build/arduino-cache/cores
          key: arduino-build-core-v1-esp32-2.0.11-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'scripts/test-fixtures.sh') }}
          restore-keys: |
            arduino-build-core-v1-esp32-2.0.11-${{ runner.os }}-
      - name: Configure host build
        run: |
          cmake -S . -B build -G Ninja -DNATIVE_ARCH=OFF -DFLEXE_LTO=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Run gates
        env:
          ARDUINO_CLI: /home/runner/bin/arduino-cli
          ARDUINO_BUILD_CACHE_PATH: ${{ github.workspace }}/build/arduino-cache
          ARDUINO_BUILD_CACHE_COMPILATIONS_BEFORE_PURGE: 0
        run: ./scripts/test-fixtures.sh
