<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="846" viewBox="0 0 1120 846" role="img" aria-labelledby="title desc">
<title id="title">two engines, the same cpu state</title>
<desc id="desc">Guest dispatch chooses interpreter or tracing JIT. Guarded exits return to the interpreter. Both share architectural state and stop for firmware-visible boundaries. Verification journals RAM, replays eligible blocks, and compares state; destructive MMIO is excluded.</desc>
<defs>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
<path d="M 48 0 H 0 V 48" fill="none" stroke="#50fa7b" stroke-opacity=".045"/>
</pattern>
<radialGradient id="glow">
<stop stop-color="#50fa7b" stop-opacity=".12"/>
<stop offset="1" stop-color="#50fa7b" stop-opacity="0"/>
</radialGradient>
<marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#50fa7b" stroke-width="1.5"/>
</marker>
<marker id="back-green" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 8 0 L 0 4 L 8 8" fill="none" stroke="#50fa7b" stroke-width="1.5"/>
</marker>
<marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#bd93f9" stroke-width="1.5"/>
</marker>
